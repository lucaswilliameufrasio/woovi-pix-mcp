name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable SemVer, for example 0.1.0 or v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate next version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          version="$(python3 scripts/release.py next "$RAW_VERSION")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Install pinned git-cliff
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: git-cliff@2.14.2
      - name: Create or resume release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git cliff --tag "v$VERSION" -o CHANGELOG.md
            python3 scripts/release.py tag "v$VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add CHANGELOG.md
            git commit -m "chore(release): prepare for v$VERSION"
            git push origin "HEAD:refs/heads/$branch"
          fi
          if ! gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty' | grep -q .; then
            cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          Release preparation for **v$VERSION**. Review the changelog and wait for CI.

          After merging, tag the reviewed commit on main with \`v$VERSION\`.
          The Release workflow revalidates main ancestry and runs the full quality
          gate, then creates a **draft** with six platform archives and SHA-256 checksums.
          Review artifacts, licensing and platform limitations before publishing the draft.

          No tag, release or financial operation is created by this preparation workflow.
          EOF
            gh pr create --base main --head "$branch" --title "Release v$VERSION" --body-file "$RUNNER_TEMP/release-pr.md"
          else
            gh pr view "$branch" --json url --jq .url
          fi
          # GITHUB_TOKEN push/PR events do not trigger CI; workflow_dispatch does.
          gh workflow run ci.yml --ref "$branch"
