name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: woovi
          POSTGRES_PASSWORD: woovi-local-test
          POSTGRES_DB: woovi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U woovi -d woovi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://woovi:woovi-local-test@localhost:5432/woovi_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test with PostgreSQL
        run: go test -count=1 ./...
      - name: Race test with PostgreSQL
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan Go vulnerabilities
        run: govulncheck ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
