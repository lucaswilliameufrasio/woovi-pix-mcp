name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test with file-backed SQLite
        run: go test -count=1 ./...
      - name: Race test with file-backed SQLite
        run: go test -race -count=1 ./...
      - name: Install pinned Litestream for optional recovery integration
        run: |
          mkdir -p "$RUNNER_TEMP/litestream"
          curl -fsSL https://github.com/benbjohnson/litestream/releases/download/v0.5.17/litestream-0.5.17-linux-x86_64.tar.gz -o "$RUNNER_TEMP/litestream/release.tar.gz"
          echo "cfb371176d164437ae869f8351cfde49bd1804ae71c61923f75c9cba9c9c006d  $RUNNER_TEMP/litestream/release.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/litestream/release.tar.gz" -C "$RUNNER_TEMP/litestream"
      - name: Test real Litestream with file and S3-compatible storage
        run: TEST_LITESTREAM_BINARY="$RUNNER_TEMP/litestream/litestream" make test-litestream
      - name: Build
        run: go build ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan Go vulnerabilities
        run: govulncheck ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
