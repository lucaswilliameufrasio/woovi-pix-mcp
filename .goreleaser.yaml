version: 2

project_name: woovi-pix-mcp

builds:
  - id: woovi-pix-mcp
    main: ./cmd/woovi-pix-mcp
    binary: woovi-pix-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/lucaseufrasio/woovi-pix-mcp/internal/buildinfo.Version={{ .Version }} -X github.com/lucaseufrasio/woovi-pix-mcp/internal/buildinfo.Commit={{ .FullCommit }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/sandbox.md
      - docs/releases.md

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./scripts/woovi-pix-mcp-installer.sh
    - glob: ./scripts/woovi-pix-mcp-installer.ps1

source:
  enabled: true
  name_template: '{{ .ProjectName }}_{{ .Version }}_source'
  format: tar.gz

changelog:
  use: git
  filters:
    exclude:
      - '^chore\(release\):'

release:
  github:
    owner: lucaswilliameufrasio
    name: woovi-pix-mcp
  draft: true
  header: |
    ## Instalação

    ### Linux e macOS

    ```sh
    curl -fsSL https://github.com/lucaswilliameufrasio/woovi-pix-mcp/releases/download/{{ .Tag }}/woovi-pix-mcp-installer.sh | sh -s -- --tag {{ .Tag }}
    ```

    ### Windows PowerShell

    ```powershell
    Invoke-WebRequest https://github.com/lucaswilliameufrasio/woovi-pix-mcp/releases/download/{{ .Tag }}/woovi-pix-mcp-installer.ps1 -OutFile woovi-pix-mcp-installer.ps1
    .\woovi-pix-mcp-installer.ps1 -Tag {{ .Tag }}
    ```

    Os instaladores verificam SHA-256 antes de instalar. Isso protege contra
    corrupção no download, não contra comprometimento da release. O binário não
    requer Go, PostgreSQL ou Docker em runtime; Litestream é separado e opcional.

    Configure com `woovi-pix-mcp setup --profile sandbox` e valide com
    `woovi-pix-mcp doctor --profile sandbox`. Nunca copie o AppID para o cliente MCP.

    Runtime validado em Linux; macOS/Windows são builds cross-compilados.
    O fallback de segredo em arquivo não é recomendado no Windows sem validar ACLs.
  extra_files:
    - glob: ./scripts/woovi-pix-mcp-installer.sh
    - glob: ./scripts/woovi-pix-mcp-installer.ps1
