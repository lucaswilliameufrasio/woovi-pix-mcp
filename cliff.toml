[changelog]
header = """
# Changelog

Changes to Woovi Pix MCP. Creation is opt-in; no Pix Out, transfers, refunds or
financial cancellations. Entries are generated from Git history and reviewed
in a release pull request before tagging.

"""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
commit_parsers = [
  { message = '^chore\(release\):', skip = true },
  { message = '^feat', group = "Features" },
  { message = '^fix', group = "Bug fixes" },
  { message = '^docs', group = "Documentation" },
  { message = '^test', group = "Tests" },
  { message = '^ci', group = "CI / Release" },
  { message = '^refactor', group = "Refactoring" },
  { message = '^chore', group = "Maintenance" },
  { message = '.*', group = "Other" },
]
tag_pattern = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
sort_commits = "oldest"
