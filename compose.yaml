services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-woovi}
      POSTGRES_USER: ${POSTGRES_USER:-woovi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-woovi-local-test}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55463}:5432"
    volumes:
      - woovi-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  woovi-postgres-data:
